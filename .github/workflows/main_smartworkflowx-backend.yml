# Pipeline: Build → Test → Migrate DB → Deploy
# Each stage gates the next — a failing test or migration blocks the deploy.
#
# Required GitHub secret:
#   AZURE_SQL_CONNECTION_STRING  — full ADO.NET connection string for the prod Azure SQL database
#   (The three AZUREAPPSERVICE_* secrets are already configured by Azure App Service)

name: Build, Test, Migrate and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ── 1. BUILD & TEST ──────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore SmartWorkFlowX.slnx

      - name: Build solution
        run: dotnet build SmartWorkFlowX.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test SmartWorkFlowX.Tests/SmartWorkFlowX.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

      - name: Publish API
        run: >
          dotnet publish SmartWorkFlowX.Api/SmartWorkFlowX.Api.csproj
          --configuration Release
          --no-build
          --output "${{ env.DOTNET_ROOT }}/myapp"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  # ── 2. MIGRATE DATABASE ──────────────────────────────────────────────────────
  # Runs AFTER build succeeds, BEFORE the new code lands on the server.
  # Uses DesignTimeDbContextFactory so only the Infrastructure project is needed —
  # no full ASP.NET Core host startup required.
  migrate:
    name: Migrate Database
    runs-on: windows-latest
    needs: build-and-test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          include-prerelease: true

      - name: Restore Infrastructure project
        run: dotnet restore SmartWorkFlowX.Infrastructure/SmartWorkFlowX.Infrastructure.csproj

      - name: Install dotnet-ef CLI tool
        run: dotnet tool install --global dotnet-ef

      - name: Apply pending EF Core migrations
        run: >
          dotnet ef database update
          --project SmartWorkFlowX.Infrastructure/SmartWorkFlowX.Infrastructure.csproj
          --verbose
        env:
          # DesignTimeDbContextFactory reads this env var directly.
          # Map: ConnectionStrings__DefaultConnection → GetConnectionString("DefaultConnection")
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

  # ── 3. DEPLOY ────────────────────────────────────────────────────────────────
  # Only runs if migration succeeded — new code always lands on a migrated schema.
  deploy:
    name: Deploy to Azure
    runs-on: windows-latest
    needs: migrate
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_425B022513E14AF69BF545A6E608FBF4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B4631C1488104836868C7F4B39DB0A58 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_716AA95EC9D5435C92212B39681974B6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: SmartWorkFlowX-Backend
          slot-name: Production
          package: .
